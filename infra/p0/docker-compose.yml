services:
  proxy:
    build:
      context: ../proxy
    ports:
      - "127.0.0.1:7890:7890"
      - "0.0.0.0:7891:7891"
      - "127.0.0.1:9090:9090"
    volumes:
      - ${P0_PROXY_DIR:-/opt/audiobook-factory-proxy}/mihomo:/usr/local/bin/mihomo:ro
      - ${P0_PROXY_DIR:-/opt/audiobook-factory-proxy}/config.yaml:/etc/mihomo/config.yaml:ro
      - ${P0_PROXY_DIR:-/opt/audiobook-factory-proxy}/subscription.base64:/etc/mihomo/subscription.base64:ro
      - ${P0_PROXY_DIR:-/opt/audiobook-factory-proxy}/data:/etc/mihomo/data
    working_dir: /etc/mihomo
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:9090/version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    restart: unless-stopped

  browser:
    build:
      context: ../browser
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9222:9222"
    volumes:
      - ../../data/chrome-profile:/data/chrome-profile
      - ../../data/downloads:/data/downloads
      - ../../data/diagnostics:/data/diagnostics
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:9222/json/version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - default
      - mvp
    restart: unless-stopped

  worker:
    build:
      context: ../../worker
    network_mode: service:browser
    depends_on:
      browser:
        condition: service_healthy
    environment:
      CDP_URL: http://127.0.0.1:9222
      AI_STUDIO_URL: https://aistudio.google.com/generate-speech
      AUDIOBOOK_CONTROL_URL: ${AUDIOBOOK_CONTROL_URL:-http://control-center:8080}
      AUDIOBOOK_WORKER_TOKEN: ${AUDIOBOOK_WORKER_TOKEN:?AUDIOBOOK_WORKER_TOKEN is required}
      AUDIOBOOK_ALLOW_INSECURE_HTTP: "false"
      WORKER_NAME: ${WORKER_NAME:-server-playwright-worker}
      OUTPUT_DIR: /tmp/audiobook-worker-output
      DIAGNOSTICS_DIR: /data/diagnostics
    volumes:
      - ../../data/diagnostics:/data/diagnostics
      - ../../examples:/app/examples:ro
    working_dir: /app
    command: ["python", "-m", "audiobook_worker.browser_worker"]
    init: true
    restart: unless-stopped

networks:
  mvp:
    external: true
    name: audiobook-factory-mvp
