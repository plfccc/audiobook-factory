[supervisord]
nodaemon=true
logfile=/data/diagnostics/supervisord.log
pidfile=/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
user=browser
autorestart=true
priority=10
stdout_logfile=/data/diagnostics/xvfb.log
redirect_stderr=true

[program:chromium]
command=/usr/bin/chromium --user-data-dir=/data/chrome-profile --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --no-first-run --no-default-browser-check --disable-dev-shm-usage --no-sandbox about:blank
user=browser
environment=DISPLAY=":99",HOME="/home/browser",XDG_RUNTIME_DIR="/tmp/browser-runtime"
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/data/diagnostics/chromium.log
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900
user=browser
environment=DISPLAY=":99"
autostart=true
autorestart=true
priority=30
stdout_logfile=/data/diagnostics/x11vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --listen 6080 --vnc localhost:5900
user=browser
autostart=true
autorestart=true
priority=40
stdout_logfile=/data/diagnostics/novnc.log
redirect_stderr=true
