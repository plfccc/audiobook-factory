[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiobook-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49,<2", "pydantic-settings>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
runtime = ["torch>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_worker"]
